      - title: "Group Identity and Agency Frictions: Evidence using Big Data"
        pdflink: "/pdf/Group_identity_dec_2021.pdf"
        note: "Submitted"
        links:
          - url: "https://dataverse.harvard.edu/dataset.xhtml?persistentId=doi%3A10.7910%2FDVN%2FBEYXT8&version=DRAFT"
            text: "R Code"
          - url: ""
            text: "Seminars"
            note: "Harvard Business School (Finance), Harvard Econ Dept, SIOE 2024 (Chicago Booth), Stevens Institute of Technology, University of North Texas, University of Nottingham. "
          - url: ""
            text: "Conferences"
            note: "AFA 2024 (Paper Session), AFA 2021 (Doctoral Session), FMA 2020 (Ph.D. Consortium, Proposal), Royal Economic Society (RES) Annual Meeting 2021, Australasian Finance and Banking Conference (AFBC) 2020, The Econometric Society Meet 2021 (Asia), The Econometric Society Meet 2021 (North America), NEUDC 2021, FMA 2022, AFA 2023 (Scheduled)."
          - url: ""
            text: "Media Coverage"
            note: "ProMarket (Chicago Booth), Oxford Business Law Blog, BeingBrief.in, World Bank Blog"
        abstract: >
            This paper examines whether similarity in social identities between a manager and the board affects executive compensation, firm value, and agency frictions. By using a novel dataset on surnames with multiple identities (native language, native place, and caste), developed by merging micro census data of 474 million Indians  with data from Linguistic Survey of India (LSI), I provide evidence that the firms with a shared group identity between a manager and the board do well compare to other firms. Due to in-group favoritism, managers of such firms earn higher compensation. These results are more substantial for group identity based on native language and native place. I also find that the firm benefits from taking on the cost of in-group favoritism as it reduces the agency frictions and increases firm value in the long run. These results are robust to the endogeneity test, managerial influence on firm,  college ties, ties from past employment, and various other checks.
      
      - title: "Are carbon emissions associated with stock returns? "
        pdflink: "https://academic.oup.com/rof/advance-article/doi/10.1093/rof/rfad013/7100359"
        coauthors: "Shivaram Rajgopal and Aneesh Raghunandan"
        note: "Review of Finance"
        links:
         - url: ""
           text: "Seminars"
           note: "Ohio State University, University of Sydney, Monash University, Citi Bank"
         - url: ""
           text: "Conferences"
           note: "MIT Asia Conference in Accounting 2021, Ph.D. Symposium at University of Texas (Austin), FMA 2021, SFS Cavalcade North America 2022, Western Finance Association (WFA) 2022, CICF 2022, UN PRI Academic Conference 2022"
        abstract: > 
           An influential emerging literature, led by Bolton and Kacperczyk (2021a), documents strong correlations between unscaled raw emissions and both stock returns and operating performance. We re-examine that data, using a sample of 2,729 U.S. firms from 2005-2019, and conclude that the associations between unscaled emissions and both stock returns and operating performance disappear once we account for firm size, industry clustering of standard errors, and vendor-estimated versus firm-disclosed emissions, both in the U.S. sample and in Europe. Investors might want to be cautious about assuming that carbon emissions are priced by equity markets.  
      
      
      - title: "Rethinking the Value and Emission Implications of Green Bonds"
        pdflink: "https://pubsonline.informs.org/doi/10.1287/mnsc.2023.00961"
        coauthors: "Shivaram Rajgopal"
        note: "Management Science"
        links:
         - url: ""
           text: "Seminars"
           note: "Citi Bank, HBS (Finance, FECS), U.S. Securities and Exchange Commission (SEC), National Stock Exchange of India (NSE), Securitites Exchange Board of India (SEBI), CAFRAL (Reserve Bank of India), Indian School of Business (ISB)"
         - url: ""
           text: "Conferences"
           note: "AFA 2022 (Doctoral Session), The Econometric Society Meeting 2021 (Winter School), CMI Field Workshop 2021, FMA 2021, Asian Meeting of the Econometric Society 2022 (CUHK, Shenzhen), FMCG 2023."
         - url: ""
           text: "Media Coverage"
           note: "Management Science (Digest), Columbia Law School (CLS) Blue Sky Blog, SEC Commissioner's Speech"
        abstract: > 
           Our analysis of green bonds issued between 2013 and 2022 reveals a distinctive shareholder preference for such assets, particularly among financial institutions. In the secondary market, the green bonds issued by financial firms’ trade at a “greenium” of 8.2 basis points compared with matched samples, which is attributed potentially to the financial firms’ efforts in channeling funds to green loans. Past work documenting a positive stock price reaction to the issuance of green bonds is isolated to financial firms and to specific issuers. Issuers of green bonds with higher emissions before the green bond issue report an insignificant reduction in such emissions after issuance. Our analysis of the sustainable lending practices of these gatekeepers reveals that the greenium earned in the green bond market does not translate to the green loan market. Furthermore, the borrowers’ performance remains unchanged in the short term, indicating a lack of due diligence by the gatekeepers. This study underscores the complex relationship between financial markets and environmental stewardship.          
          
      - title: "Investment and Governance: Through the Lens of Sustainability"
        pdflink: "https://www.econometricsociety.org/regional-activities/conference-papers/view/277/641"
        coauthors: "Roberto Rigobon (MIT Sloan)"
        note: "New Draft Soon"
        links:
          - url: ""
            text: "Conferences"
            note: "AFA 2026, European Winter Meeting of Econometric Society (EWSC) 2024, SIOE 2025, GRASFI 2025, MIT Sloan (Sustainability Initiative Seminar Series 2024), Inter Finance PhD Seminar Series 2024."
          - url: ""
            text: "Media Coverage"
            note: "E-axes (Forum on climate change, macroeconomics, and finance), ESG.Guide, ProMarket (Chicago Booth), ECGI Blog."
        abstract: >
            Does investment inspire better governance? Using a global sample of 3,944 sustainable bonds, issued by public firms from 2013 to 2022, the causal generalized method of moments (GMM) estimates suggest that 1% increase in sustainable debt to total debt ratio improves the sustainable governance practices by 9%. To address potential simultaneity bias, we employ a method that utilizes the heteroskedasticity of structural shocks. Our findings also confirm that the standard panel regressions, even with fixed effects, may exaggerate effects due to simultaneity. Our findings remain consistent across different measures of sustainable governance using different databases and battery of other checks.      
      
      - title: "Impact of JOBS Act on M&As (Permanent Working Paper)"
        pdflink: "/pdf/Jobs_act_July_2020.pdf"
        coauthors: "Sudip Gupta, Iftekhar Hasan, and Anthony Saunders"
        note: ""
        links:
          - url: ""
            text: "Conferences"
            note: "MFA 2018, FMA 2018, Australasian Finance and Banking Conference (ABFC) 2018."
          - url: ""
            text: "Media Coverage"
            note: "Columbia Law School (CLS) Blue Sky Blog"
        abstract: >
            Do changes in the IPO regulatory environment affect private firms’ exit choices, bargaining abilities, and valuations? Using the JOBS Act as an exogenous shock to the exit decisions among private firms, we observe that their valuations as M&A targets increase after the Act, negatively affecting acquirer wealth gains. These results are more prominent for VC-backed targets. We also find that stock (cash) deals decrease (increase) for private firms after the Act. Our results are robust to endogeneity concerns, sampling bias, alternative measures, placebo tests, merger waves, and various other vigorous checks.
            
      
      - title: "Tournament Culture and Corporate Misconduct: Evidence using Machine Learning"
        pdflink: "/pdf/Culture_Dec_2021.pdf"
        coauthors: ""
        note: ""
        links:
          - url: ""
            text: "Conferences"
            note: "FMA 2020, Financial Research Group (FRG) Field Workshop 2020, African Meeting of the Econometric Society 2022"
          - url: ""
            text: "Media Coverage"
            note: "Oxford Business Law Blog"
        abstract: >
            This paper examines the type of firm culture which leads to corporate misconduct activities. Using the management's tone in the 10-K report as a proxy for culture,  we find that higher internal “compete” culture (or tournament culture) increases  corporate misconduct activities such as restatements, earnings management, and accounting fraud by increasing the firm risk.The results are robust to external validity tests, firm-specific systematic risk, market competition, governance characteristics, CEO effects, and endogeneity concerns. 
      
       
      - title: "Debt Markets Retort to Mandatory Corporate Social Responsibility"
        pdflink: ""
        coauthors: ""
        note: "Submitted"
        links:
          - url: ""
            text: "Research Grant"
            note: "NSE - NYU Stern research grant for studying Indian capital markets."
          - url: ""
            text: "Conferences"
            note: "RCF-ECGI Corporate Governance 2025, MIT Sloan Seminar Series, New York University (NYU) - National Stock Exchange (NSE) Conference 2018, Global PhD Colloquium 2019, FMA 2020, African Meeting of the Econometric Society 2023 (Scheduled)"
          - url: ""
            text: "Media Coverage"
            note: "NSE White Paper Series, FinReg Blog (Duke University)"
        abstract: >
            How do debt markets respond to mandatory corporate social responsibility (CSR)? Using the mandatory CSR rule under the Indian Companies Act 2013 as an identification design, I find that the yield spread increases by 103 basis points for affected firms compared to others. As a result, these firms reduce the issuance amount. Using a structural framework, I show that mandatory CSR diminishes a firm’s free cash flow, which causes the cost of debt to increase. The increased spread shrinks for firms with good governance, business group-affiliated firms, and firms that disclose information on non-government organizations used for dispensing CSR funds. 
            
      
       - title: "Natural Assets and Public Green Debt"
        pdflink: ""
        coauthors: "William W.Xiong"
        note: "Preparing for Journal Submission"
        links:
          - url: ""
            text: "Conferences"
            note: "University of Connecticut Seminar Series 2026, Financial Management Association (FMA) 2026 (Scheduled), Deakin University Seminar Series 2026 (Scheduled) "
          - url: ""
            text: "Media Coverage"
            note: ""
        abstract: >
            How  This study investigates whether public debt prices risk to natural assets. Analysis of sovereign green bonds (2016–2024) reveals that investors price natural capital depletion but not biodiversity loss—a 1% increase in depletion is associated with 21-40 basis-point higher yield. A novel dataset on green bond-funded projects, developed using an Artificial Intelligence (AI) model, shows that “green intentions” alone do not influence asset prices without “green efforts.” While carbon emissions per capita remain unchanged after issuance, 40% of bonds funding sustainable forestry projects result in a 0.2% increase in forest area (as a percentage of habitable land) compared to pre-issuance trends.
         
        
